name: Mercari Monitor

on:
  schedule:
    # 每 15 分鐘自動執行一次
    - cron: '*/15 * * * *'
  workflow_dispatch: # 支援後台手動執行按鈕

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: |
          pip install requests python-dotenv

      - name: 執行單次檢查
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONITOR_KEYWORD: ${{ secrets.MONITOR_KEYWORD }}
        run: |
          python mercari_monitor.py

      - name: 自動保存已讀商品記錄回 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_items.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen_items.txt [skip ci]" && git push)
